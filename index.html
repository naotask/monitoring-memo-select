<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f6b61">
  <title>モニタリングメモ（選択式・試作）</title>
  <style>
    :root{--ink:#20312f;--muted:#647673;--paper:#fffdf8;--bg:#edf4f1;--line:#cedbd7;--main:#0f6b61;--main2:#e0f0eb;--danger:#a64040;--shadow:0 10px 28px rgba(31,66,59,.1)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf3ef,#f7f2e8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.5;min-height:100vh}
    button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:14px 12px 70px}.top{display:flex;align-items:center;gap:11px;margin:3px 2px 14px}.mark{width:42px;height:42px;border-radius:13px;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:var(--shadow)}h1{font-size:1.25rem;margin:0}.sub{font-size:.78rem;color:var(--muted)}
    .notice{background:#fff3d8;border:1px solid #ead09a;border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:.86rem}.panel{background:rgba(255,253,248,.97);border:1px solid rgba(186,204,198,.8);border-radius:19px;padding:16px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}.field{margin-bottom:17px}.field>label,.title{display:block;font-weight:750;margin:0 0 8px}.required{color:var(--danger);font-size:.78rem}
    input[type=date],input[type=time],input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:11px 12px;color:var(--ink);outline:none}textarea{min-height:84px;resize:vertical}input:focus,textarea:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(15,107,97,.12)}
    .choice-section{border-top:1px solid #dce5e2;padding-top:15px;margin-top:2px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:inline-block;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:.92rem;cursor:pointer;user-select:none}.choice input:checked+span{border-color:var(--main);background:var(--main2);color:var(--main);font-weight:750}.choice input:focus-visible+span{outline:3px solid rgba(15,107,97,.2)}
    .other{display:none;margin-top:9px}.other.show{display:block}.hint{font-size:.8rem;color:var(--muted);margin:7px 0 0}.actions{display:flex;gap:9px;margin:18px 0 15px}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer}.primary{background:var(--main);color:#fff;flex:1}.ghost{background:#edf1ef;color:#485b57}.output textarea{min-height:180px;background:#fbfdfc}.status{text-align:center;min-height:24px;color:var(--main);font-weight:700}.privacy{text-align:center;color:var(--muted);font-size:.76rem;margin:14px 0 0}
    @media(max-width:600px){.app{padding:10px 9px 60px}.panel{padding:14px;border-radius:16px}.grid{grid-template-columns:1fr 1fr}.name-field{grid-column:1/-1}.choice span{padding:9px 11px}.actions{flex-direction:column}.ghost{width:100%}}
  </style>
</head>
<body>
<main class="app">
  <header class="top"><div class="mark">M</div><div><h1>モニタリングメモ</h1><div class="sub">選んで、必要なところだけ書く</div></div></header>
  <div class="notice">確認用の試作です。選択肢の文章はあとで変更できます。</div>
  <section class="panel">
    <div class="grid">
      <div class="field name-field"><label for="name">利用者名 <span class="required">必須</span></label><input id="name" type="text" autocomplete="off"></div>
      <div class="field"><label for="date">日付 <span class="required">必須</span></label><input id="date" type="date"></div>
      <div class="field"><label>時間</label><div style="display:flex;align-items:center;gap:6px"><input id="start" type="time" aria-label="開始時刻"><span>～</span><input id="end" type="time" aria-label="終了時刻"></div></div>
    </div>

    <div id="sections"></div>

    <div class="field choice-section">
      <label for="free">自由メモ</label>
      <textarea id="free" placeholder="ほかに聞いたことや気になったこと"></textarea>
    </div>

    <div class="actions"><button class="btn primary" id="make" type="button">文章を作成</button><button class="btn ghost" id="clear" type="button">入力をクリア</button></div>
    <div class="field output"><label for="output">作成した文章</label><textarea id="output" placeholder="選択後に「文章を作成」を押してください"></textarea></div>
    <div id="status" class="status" aria-live="polite"></div>
    <p class="privacy">この試作画面の入力内容は保存されません。</p>
  </section>
</main>
<script>
(()=>{'use strict';
const DATA=[
  {id:'changes',label:'体調・生活の変化',prefix:'体調・生活状況について、',options:['大きな変化はみられない','体調は安定している','食欲に変化はない','睡眠状況に変化はない']},
  {id:'service',label:'サービス利用状況',prefix:'サービス利用状況について、',options:['予定どおり利用できている','継続して利用できている','休まず利用できている','一部利用できていない']},
  {id:'goal',label:'短期目標の状況',prefix:'短期目標について、',options:['利用できている','継続できている','維持できている','実施できている','大きな変化なく過ごせている']},
  {id:'clientWords',label:'本人の発言',prefix:'本人：',options:['特に困りごとはないと話される','現状の継続を希望される','変わりなく過ごしていると話される']},
  {id:'familyWords',label:'家族の発言',prefix:'家族：',options:['特に困りごとはないと話される','現状の継続を希望される','本人の状態に変化はないと話される']}
];
const $=id=>document.getElementById(id);
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('sections').innerHTML=DATA.map(s=>`<section class="field choice-section" data-section="${s.id}"><div class="title">${s.label}</div><div class="choices">${s.options.map((o,i)=>`<label class="choice"><input type="checkbox" name="${s.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}<label class="choice"><input type="checkbox" class="other-check" name="${s.id}" value="その他"><span>その他</span></label></div><textarea class="other" id="${s.id}-other" placeholder="その他の内容を入力"></textarea><p class="hint">複数選べます</p></section>`).join('');
document.querySelectorAll('.other-check').forEach(c=>c.addEventListener('change',()=>{const t=$(`${c.name}-other`);t.classList.toggle('show',c.checked);if(!c.checked)t.value=''}));
function period(s){s=(s||'').trim();return !s?'':/[。！？!?]$/.test(s)?s:s+'。'}
function values(id){const v=[...document.querySelectorAll(`input[name="${id}"]:checked`)].filter(x=>x.value!=='その他').map(x=>x.value);const other=$(`${id}-other`).value.trim();if(other)v.push(other);return v}
function makeText(){const parts=[];const date=$('date').value;if(date){const[y,m,d]=date.split('-');parts.push(`${Number(y)}年${Number(m)}月${Number(d)}日、`)}if($('start').value||$('end').value)parts.push(`${$('start').value||'―'}～${$('end').value||'―'}にモニタリングを実施。`);DATA.forEach(s=>{const v=values(s.id);if(v.length)parts.push(s.prefix+period(v.join('、')))});if($('free').value.trim())parts.push(period($('free').value));$('output').value=parts.join('');$('status').textContent=parts.length?'文章を作成しました':'内容を選択または入力してください';setTimeout(()=>{$('status').textContent=''},2500)}
function clearAll(){document.querySelectorAll('input[type="checkbox"]').forEach(x=>x.checked=false);document.querySelectorAll('textarea,input[type="text"],input[type="time"]').forEach(x=>x.value='');document.querySelectorAll('.other').forEach(x=>x.classList.remove('show'));$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10)}
$('make').addEventListener('click',makeText);$('clear').addEventListener('click',clearAll);clearAll();
})();
</script>
</body>
</html>
